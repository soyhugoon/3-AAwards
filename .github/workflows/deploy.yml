name: 🚀 Deploy to InfinityFree

on:
  push:
    branches: [ main ]   # Cambia "main" por "master" si usas esa rama

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Si tu proyecto necesita build (ej: Node.js, Laravel, etc.)
      # - name: Instalar dependencias y build
      #   run: |
      #     npm install
      #     npm run build

      - name: 📂 Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/          # Carpeta principal de tu sitio (cámbiala si es diferente)
          # local-dir: ./dist/          # Descomenta si solo quieres subir una carpeta de build
          # exclude:                    # Archivos/carpetas a excluir
          #   - .git/
          #   - .github/
          #   - node_modules/
